# Fly.io deployment for the ChronoFlow indexer API.
#
#   fly launch --no-deploy --copy-config --name chronoflow-api
#   fly secrets set DATABASE_URL=... CONTRACT_ID=... CORS_ORIGIN=...
#   fly deploy
#
# Build from the repository root so the workspace packages resolve:
#   fly deploy --config packages/backend/fly.toml
#
# A container image is used instead of a buildpack because the Prisma engine and
# the workspace layout both need the monorepo context.

[build]
  dockerfile = "Dockerfile"

[deploy]
  # The repository ships the schema as the source of truth (no migration files
  # yet), so the release step syncs the schema. Switch to `db:deploy` once you
  # commit Prisma migrations.
  release_command = "pnpm --filter @chronoflow/backend run db:push"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
  LOG_LEVEL = "info"
  INDEXER_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"
